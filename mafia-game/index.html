<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>ورود کاربران</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:0;font-family:'Vazirmatn',sans-serif;background:linear-gradient(135deg,#c3ecff,#c3ffe1);display:flex;justify-content:center;align-items:center;height:100vh;}
  .card{background:white;padding:30px;border-radius:20px;box-shadow:0 15px 25px rgba(0,0,0,0.2);width:320px;text-align:center;animation:fadeIn 1s ease;}
  input{width:90%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #ccc;transition:0.3s;}
  input:focus{border-color:#2196F3;transform:scale(1.02);}
  button{width:95%;padding:12px;border:none;border-radius:12px;background:#2196F3;color:white;font-weight:bold;font-size:16px;margin-top:10px;cursor:pointer;transition:0.3s;}
  button:hover{transform:scale(1.05);background:#0d8ae5;}
  @keyframes fadeIn{0%{opacity:0;transform:translateY(-20px);}100%{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="card">
  <h2>ورود</h2>
  <input id="user" type="text" placeholder="نام کاربری">
  <input id="pass" type="password" placeholder="رمز عبور">
  <button onclick="loginUser()">ورود کاربر</button>
  <button style="background:#333;margin-top:8px;" onclick="loginAdmin()">ورود مدیر</button>
</div>
<script>
function loginUser(){ window.location.href='user.html'; }
function loginAdmin(){ window.location.href='admin.html'; }
</script>
</body>
</html>
